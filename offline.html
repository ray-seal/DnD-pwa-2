<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B0000">
    <title>Offline - D&D Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(43, 43, 43, 0.9);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #8B0000;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #8B0000;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #a52a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🐉</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your connection to the realm. 
            But fear not, brave adventurer! Your saved progress is safe.
        </p>
        <p>
            Reconnect to the internet to continue your journey through the Lost Mines of Phandelver.
        </p>
        <a href="/" class="btn">Try Again</a>
    </div>
</body>
</html>
